<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid and Flexbox Layout</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="./src/output.css">
    <style>
        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="p-4">
    <header class="bg-blue-500 text-white p-4">
        <h1 class="text-3xl">Grid and Flexbox Layout</h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-3 min-h-screen ">
        <section class="lg:col-span-2 flex gap-1  ">
            <div class="bg-amber-200 flex-1 text-center pt-3">Flexbox Item 1</div>
            <div class="bg-amber-500 flex-1 text-center pt-3">Flexbox Item 2</div>
        </section>
        <aside class="bg-green-200 p-4 text-center pt-3">Sidebar</aside>
    </main>

    <footer class="bg-gray-800 text-white p-4 mt-4">
        <p>&copy; 2025 Solomon Tsehay's Blog</p>
    </footer>
</body>

</html>
